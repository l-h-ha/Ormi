enums:
  - name: OpEnum
    cpp_type: ormi::ops::OpEnum
    include: core/ops.h
    values:
      - { name: LEAF, cpp: LEAF, aliases: [LEAF] }
      - { name: CONST, cpp: CONST, aliases: [CONST] }

      - { name: NEG, cpp: NEG, aliases: [NEG] }
      - { name: EXP, cpp: EXP, aliases: [EXP] }
      - { name: LOG, cpp: LOG, aliases: [LOG] }
      - { name: SIN, cpp: SIN, aliases: [SIN] }
      - { name: COS, cpp: COS, aliases: [COS] }

      - { name: ADD, cpp: ADD, aliases: [ADD] }
      - { name: SUB, cpp: SUB, aliases: [SUB] }
      - { name: MUL, cpp: MUL, aliases: [MUL] }
      - { name: DIV, cpp: DIV, aliases: [DIV] }
      - { name: POW, cpp: POW, aliases: [POW] }
      - { name: MATMUL, cpp: MATMUL, aliases: [MATMUL] }

      - { name: SUM, cpp: SUM, aliases: [SUM] }
      - { name: TRANSPOSE, cpp: TRANSPOSE, aliases: [TRANSPOSE] }
      - { name: RESHAPE, cpp: RESHAPE, aliases: [RESHAPE] }
      - { name: EXPAND, cpp: EXPAND, aliases: [EXPAND] }

      - { name: FRAC_DERIV, cpp: FRAC_DERIV, aliases: [FRAC_DERIV] }

functions:
  - name: op_to_string
    include: core/ops.h
    namespace: ormi::ops
    cpp: to_string
    python: op_to_string
    overload: "std::string (*)(ormi::ops::OpEnum)"
    args:
      - { name: op }