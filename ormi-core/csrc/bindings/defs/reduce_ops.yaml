ops:
  - name: sum
    include: core/ops/reduce/sum.h
    namespace: ormi::ops
    cpp: sum
    python: sum
    returns: "Node"
    overload: "std::shared_ptr<ormi::Node> (*)(const std::shared_ptr<ormi::Node>&, bool)"
    args:
      - { name: node, py_type: "Node" }
      - { name: keepdims, py_type: "bool", default: false }

  - name: sum_axes
    include: core/ops/reduce/sum.h
    namespace: ormi::ops
    cpp: sum
    python: sum_axes
    returns: "Node"
    overload: "std::shared_ptr<ormi::Node> (*)(const std::shared_ptr<ormi::Node>&, std::vector<int>, bool)"
    args:
      - { name: node, py_type: "Node" }
      - { name: axes, py_type: "Sequence[int]" }
      - { name: keepdims, py_type: "bool", default: false }