functions:
  - name: grad
    include: core/autograd.h
    namespace: ormi
    cpp: grad
    python: grad
    returns: "list[Node | None]"
    overload: "std::vector<std::shared_ptr<ormi::Node>> (*)(const std::shared_ptr<ormi::Node>&, const std::vector<std::shared_ptr<ormi::Node>>&)"
    args:
      - { name: root, py_type: "Node" }
      - { name: inputs, py_type: "Sequence[Node]" }

  - name: grad_with_seed
    include: core/autograd.h
    namespace: ormi
    cpp: grad
    python: grad_with_seed
    returns: "list[Node | None]"
    overload: "std::vector<std::shared_ptr<ormi::Node>> (*)(const std::shared_ptr<ormi::Node>&, const std::vector<std::shared_ptr<ormi::Node>>&, const std::shared_ptr<ormi::Node>&)"
    args:
      - { name: root, py_type: "Node" }
      - { name: inputs, py_type: "Sequence[Node]" }
      - { name: seed, py_type: "Node" }

  - name: diff
    include: core/autograd.h
    namespace: ormi
    cpp: diff
    python: diff
    returns: "Node"
    overload: "std::shared_ptr<ormi::Node> (*)(const std::shared_ptr<ormi::Node>&, const std::shared_ptr<ormi::Node>&, int)"
    args:
      - { name: y, py_type: "Node" }
      - { name: x, py_type: "Node" }
      - { name: order, py_type: "int", default: 1 }