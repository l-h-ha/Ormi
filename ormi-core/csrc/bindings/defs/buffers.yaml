classes:
  - name: DataBuffer
    cpp_type: ormi::Buffer
    holder: std::shared_ptr<ormi::Buffer>
    include: core/buffer.h

    properties_readonly:
      - { name: bytes, expr: self.bytes }
      - { name: shape, expr: self.shape }
      - { name: device, expr: self.device }
      - { name: dtype, expr: self.dtype }

    methods:
      - name: item
        cpp: item
        args:
          - { name: index, default: 0 }

      - { name: numel, cpp: numel }

functions:
  - name: empty_buffer
    include: core/buffer.h
    namespace: ormi
    cpp: empty
    python: empty_buffer
    args:
      - { name: shape }
      - { name: device }
      - { name: dtype }

  - name: full_buffer
    include: core/buffer.h
    namespace: ormi
    cpp: full
    python: full_buffer
    overload: "std::shared_ptr<ormi::Buffer> (*)(const std::vector<int>&, float, ormi::Device, ormi::DType)"
    args:
      - { name: shape }
      - { name: fill_value }
      - { name: device }
      - { name: dtype }

  - name: scalar_buffer
    include: core/buffer.h
    namespace: ormi
    cpp: scalar
    python: scalar_buffer
    overload: "std::shared_ptr<ormi::Buffer> (*)(float, ormi::Device, ormi::DType)"
    args:
      - { name: value }
      - { name: device }
      - { name: dtype }

  - name: zeros_buffer
    include: core/buffer.h
    namespace: ormi
    cpp: zeros
    python: zeros_buffer
    overload: "std::shared_ptr<ormi::Buffer> (*)(const std::vector<int>&, ormi::Device, ormi::DType)"
    args:
      - { name: shape }
      - { name: device }
      - { name: dtype }

  - name: ones_buffer
    include: core/buffer.h
    namespace: ormi
    cpp: ones
    python: ones_buffer
    overload: "std::shared_ptr<ormi::Buffer> (*)(const std::vector<int>&, ormi::Device, ormi::DType)"
    args:
      - { name: shape }
      - { name: device }
      - { name: dtype }

  - name: numpy_to_buffer
    include: bindings/numpy_buffer.h
    namespace: ormi
    cpp: numpy_to_buffer
    python: numpy_to_buffer
    args:
      - { name: array }
      - { name: device }

  - name: buffer_to_numpy
    include: bindings/numpy_buffer.h
    namespace: ormi
    cpp: buffer_to_numpy
    python: buffer_to_numpy
    args:
      - { name: buffer }

  - name: buffer_to_string
    include: core/buffer.h
    namespace: ormi
    cpp: to_string
    python: buffer_to_string
    overload: "std::string (*)(const ormi::Buffer&)"
    args:
      - { name: buffer }