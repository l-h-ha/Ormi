classes:
  - name: SGD
    cpp_type: ormi::optim::SGD
    include: core/optim/sgd.h
    includes:
      - utility

    constructors:
      - signature: "const std::vector<std::pair<std::shared_ptr<ormi::Node>, std::shared_ptr<ormi::Node>>>&, float"
        args:
          - { name: parameter_grads }
          - { name: learning_rate }

    methods:
      - { name: step, cpp: step }