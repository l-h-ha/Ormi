ops:
  - name: expand
    include: core/ops/view/expand.h
    namespace: ormi::ops
    cpp: expand
    python: expand
    returns: "Node"
    args:
      - { name: node, py_type: "Node" }
      - { name: shape, py_type: "Sequence[int]" }

  - name: reshape
    include: core/ops/view/reshape.h
    namespace: ormi::ops
    cpp: reshape
    python: reshape
    returns: "Node"
    args:
      - { name: node, py_type: "Node" }
      - { name: shape, py_type: "Sequence[int]" }

  - name: transpose
    include: core/ops/view/transpose.h
    namespace: ormi::ops
    cpp: transpose
    python: transpose
    returns: "Node"
    args:
      - { name: node, py_type: "Node" }
      - { name: axes, py_type: "Sequence[int]" }