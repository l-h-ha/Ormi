[project]
name = "ormi-core"
version = "0.1.0a6"
description = "A C++ lazily accelerated tensor/autograd engine."
readme = "README.md"
authors = [{ name = "Ha H. Le" }]
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
cuda = ["ormi-cuda==0.1.0a6"]

[build-system]
requires = ["scikit-build-core>=1.0.0", "pybind11>=2.11.0", "PyYAML>=6.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/ormi_core"]
wheel.license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
install.components = ["core"]
cmake.build-type = "Release"
sdist.inclusion-mode = "explicit"
sdist.include = [
    "CHANGELOG.md",
    "CMakeLists.txt",
    "CMakePresets.json",
    "LICENSE",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
    "vcpkg.json",
    "benchmarks/",
    "csrc/",
    "example/",
    "python-examples/",
    "src/",
    "tests/",
]
sdist.exclude = [
    "**/.cmake/",
    "**/.pytest_cache/",
    "**/CMakeFiles/",
    "**/__pycache__/",
    "**/*.dir/",
    "**/*.egg-info/",
    "**/Debug/",
    "**/Release/",
    "**/RelWithDebInfo/",
    "**/MinSizeRel/",
    "**/CMakeCache.txt",
    "**/cmake_install.cmake",
    "**/*.sln",
    "**/*.vcxproj",
    "**/*.vcxproj.filters",
    "**/*.pyd",
    "**/*.dll",
    "**/*.lib",
    "**/*.exp",
    "**/*.pdb",
    "**/*.obj",
    "**/*.pyc",
]

[tool.scikit-build.cmake.define]
ORMI_BUILD_PYTHON = "ON"
ORMI_BUILD_TESTS = "OFF"
ORMI_BUILD_BENCHMARKS = "OFF"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-win32 *-manylinux_i686 *-musllinux*"
manylinux-x86_64-image = "manylinux_2_28"
test-requires = ["pytest", "PyYAML>=6.0"]
test-command = "pytest {package}/tests -q"

[tool.cibuildwheel.config-settings]
"build-dir" = "build/{wheel_tag}"
"cmake.define.ORMI_ENABLE_CUDA" = "OFF"
"cmake.define.ORMI_ENABLE_OPENBLAS" = "ON"
"cmake.define.ORMI_ENABLE_SLEEF" = "ON"

[tool.cibuildwheel.linux]
before-all = [
    "dnf install -y -q dnf-plugins-core epel-release git make perl gcc-toolset-13-gcc gcc-toolset-13-gcc-c++",
    "dnf config-manager --set-enabled powertools",
    "/opt/python/cp310-cp310/bin/python -m venv /opt/auditwheel && /opt/auditwheel/bin/pip install -q auditwheel==6.7.0",
    "git clone --branch v0.3.33 --depth 1 https://github.com/OpenMathLib/OpenBLAS.git /tmp/openblas",
    "if ! make -C /tmp/openblas -j\"$(nproc)\" DYNAMIC_ARCH=1 NO_STATIC=1 NO_LAPACK=1 NOFORTRAN=1 USE_OPENMP=0 shared > /tmp/openblas-build.log 2>&1; then tail -n 200 /tmp/openblas-build.log; exit 1; fi",
    "if ! make -C /tmp/openblas PREFIX=/opt/openblas install > /tmp/openblas-install.log 2>&1; then tail -n 200 /tmp/openblas-install.log; exit 1; fi",
    "git clone --branch 3.9.0 --depth 1 https://github.com/shibatch/sleef.git /tmp/sleef",
    "if ! cmake -S /tmp/sleef -B /tmp/sleef/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/sleef -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON -DSLEEF_BUILD_LIBM=ON -DSLEEF_BUILD_QUAD=OFF -DSLEEF_BUILD_DFT=OFF -DSLEEF_BUILD_GNUABI_LIBS=OFF -DSLEEF_BUILD_TESTS=OFF -DSLEEF_DISABLE_SSL=ON -DSLEEF_ENABLE_TLFLOAT=OFF -DSLEEF_ENABLE_TESTER4=OFF > /tmp/sleef-configure.log 2>&1; then tail -n 200 /tmp/sleef-configure.log; exit 1; fi",
    "if ! cmake --build /tmp/sleef/build --parallel \"$(nproc)\" > /tmp/sleef-build.log 2>&1; then tail -n 200 /tmp/sleef-build.log; exit 1; fi",
    "if ! cmake --install /tmp/sleef/build > /tmp/sleef-install.log 2>&1; then tail -n 200 /tmp/sleef-install.log; exit 1; fi",
    "test -e /opt/sleef/lib/libsleef.so.3"
]
environment = { PATH="/opt/rh/gcc-toolset-13/root/usr/bin:$PATH", LD_LIBRARY_PATH="/opt/openblas/lib:/opt/sleef/lib:$LD_LIBRARY_PATH", CC="/opt/rh/gcc-toolset-13/root/usr/bin/gcc", CXX="/opt/rh/gcc-toolset-13/root/usr/bin/g++", CMAKE_PREFIX_PATH="/opt/openblas;/opt/sleef", ORMI_WHEEL_EXPECT_CUDA="0" }
repair-wheel-command = "/opt/auditwheel/bin/auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
before-build = "python -m pip install delvewheel==1.13.0"
environment = { CMAKE_GENERATOR="Ninja", SKBUILD_CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake", ORMI_WHEEL_EXPECT_CUDA="0" }
repair-wheel-command = "delvewheel repair --ignore-existing --analyze-existing --no-mangle-all -w {dest_dir} {wheel}"
