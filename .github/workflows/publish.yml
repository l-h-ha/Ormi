name: Build and Publish Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'ormi-core-v*'

jobs:
  validate_release:
    name: Validate package versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install check dependencies
        run: python -m pip install packaging pytest

      - name: Test version checks
        run: python -I -m pytest --noconftest --import-mode=importlib .github/tests -q -p no:cacheprovider

      - name: Match package versions, dependency pins, and release tag
        id: versions
        run: python .github/scripts/check_versions.py

  build_python:
    name: Build ormi
    needs: validate_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install build

      - name: Build source archive and wheel
        run: python -m build ormi --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-ormi
          path: dist/*

  build_core_wheels:
    name: Build ormi-core on ${{ matrix.os }}
    needs: validate_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install pinned C++ dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          C:\vcpkg\vcpkg.exe install
          --x-manifest-root=${{ github.workspace }}\ormi-core
          --triplet=x64-windows
          
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10,<3.14"
        with:
          package-dir: ormi-core

      - uses: actions/upload-artifact@v4
        with:
          name: release-core-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_cuda_wheels:
    name: Build ormi-cuda on ${{ matrix.os }}
    needs: validate_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.0'

      - name: Build wheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10,<3.14"
        with:
          package-dir: ormi-cuda

      - uses: actions/upload-artifact@v4
        with:
          name: release-cuda-wheel-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build ormi-core source archive
    needs: validate_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build sdist
        run: pipx run build --sdist ormi-core

      - uses: actions/upload-artifact@v4
        with:
          name: release-core-sdist
          path: ormi-core/dist/*.tar.gz

  test_install:
    name: Install ormi on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: [validate_release, build_python, build_core_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ['3.10', '3.11', '3.12', '3.13']
    env:
      ORMI_RELEASE_VERSION: ${{ needs.validate_release.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Create clean Python environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ormi-install"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$RUNNER_TEMP/ormi-install/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/ormi-install/bin" >> "$GITHUB_PATH"
          fi

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Resolve Windows JIT compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-Command cl.exe -ErrorAction Stop
          "ORMI_CPU_JIT_CXX=$($compiler.Source)" | Out-File $env:GITHUB_ENV -Append
          "ORMI_CPU_JIT_CXX_ID=msvc" | Out-File $env:GITHUB_ENV -Append

      - name: Resolve Linux JIT compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "ORMI_CPU_JIT_CXX=$(command -v g++)" >> "$GITHUB_ENV"
          echo "ORMI_CPU_JIT_CXX_ID=gcc" >> "$GITHUB_ENV"

      - name: Download ormi
        uses: actions/download-artifact@v4
        with:
          name: release-ormi
          path: dist

      - name: Download matching core wheels
        uses: actions/download-artifact@v4
        with:
          pattern: release-core-wheels-${{ matrix.os }}-*
          path: dist
          merge-multiple: true

      - name: Download test and runtime dependencies
        run: >-
          python -m pip download --only-binary=:all:
          --dest dependencies numpy "tqdm>=4.67,<5" pytest

      - name: Install built packages and check dependencies
        run: |
          python -m pip install --no-index --only-binary=:all: --find-links dist --find-links dependencies "ormi==${{ needs.validate_release.outputs.version }}" pytest
          python -m pip check

      - name: Test installed Python API
        working-directory: ${{ runner.temp }}
        env:
          ORMI_CPU_JIT_CACHE_DIR: ${{ runner.temp }}/ormi-install-jit
        run: >-
          python -I -m pytest --noconftest --import-mode=importlib
          --rootdir "${{ github.workspace }}/ormi/release-tests"
          "${{ github.workspace }}/ormi/release-tests"
          -q -p no:cacheprovider

      - name: Test CPU training without a compiler
        working-directory: ${{ runner.temp }}
        env:
          ORMI_CPU_JIT_CACHE_DIR: ${{ runner.temp }}/ormi-compiler-free-jit
          ORMI_CPU_JIT_CXX: ormi-compiler-does-not-exist
          ORMI_CPU_JIT_CXX_ID: gcc
        run: >-
          python -I -m pytest --noconftest --import-mode=importlib
          --rootdir "${{ github.workspace }}/ormi/release-tests"
          "${{ github.workspace }}/ormi/release-tests"
          -q -p no:cacheprovider

  publish:
    name: Publish release and package index
    if: github.ref_type == 'tag'
    needs: [build_python, build_core_wheels, build_cuda_wheels, build_sdist, test_install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: true

      - name: Generate Index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pypi_server/whl/ormi pypi_server/whl/ormi-core pypi_server/whl/ormi-cuda

          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=whl/"><title>ORMI packages</title></head><body><a href="whl/">ORMI packages</a></body></html>' > pypi_server/index.html

          echo "<!DOCTYPE html><html><body>" > pypi_server/whl/index.html
          echo "<a href=\"ormi/\">ormi</a>" >> pypi_server/whl/index.html
          echo "<a href=\"ormi-core/\">ormi-core</a>" >> pypi_server/whl/index.html
          echo "<a href=\"ormi-cuda/\">ormi-cuda</a>" >> pypi_server/whl/index.html
          echo "</body></html>" >> pypi_server/whl/index.html
          
          echo "<!DOCTYPE html><html><body>" > pypi_server/whl/ormi/index.html
          echo "<!DOCTYPE html><html><body>" > pypi_server/whl/ormi-core/index.html
          echo "<!DOCTYPE html><html><body>" > pypi_server/whl/ormi-cuda/index.html
          
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' | while read tag; do
            if [ -n "$tag" ]; then
              gh release view "$tag" --repo ${{ github.repository }} --json assets --jq '.assets[] | select(.name | startswith("ormi-")) | "<a href=\"" + .url + "\">" + .name + "</a><br>"' >> pypi_server/whl/ormi/index.html
              gh release view "$tag" --repo ${{ github.repository }} --json assets --jq '.assets[] | select(.name | startswith("ormi_core-")) | "<a href=\"" + .url + "\">" + .name + "</a><br>"' >> pypi_server/whl/ormi-core/index.html
              gh release view "$tag" --repo ${{ github.repository }} --json assets --jq '.assets[] | select(.name | startswith("ormi_cuda-")) | "<a href=\"" + .url + "\">" + .name + "</a><br>"' >> pypi_server/whl/ormi-cuda/index.html
            fi
          done
          
          echo "</body></html>" >> pypi_server/whl/ormi/index.html
          echo "</body></html>" >> pypi_server/whl/ormi-core/index.html
          echo "</body></html>" >> pypi_server/whl/ormi-cuda/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pypi_server

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
