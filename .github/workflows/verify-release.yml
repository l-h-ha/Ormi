name: Verify Published Wheels

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published ormi-core version
        required: true
        type: string
  workflow_run:
    workflows: ["Build and Publish Packages"]
    types: [completed]

permissions:
  contents: read

jobs:
  release:
    name: Resolve release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: release
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            tag="ormi-core-v$version"
          else
            tag="$RELEASE_BRANCH"
            version="${tag#ormi-core-v}"
          fi

          if [[ -z "$version" || "$tag" != "ormi-core-v$version" ]]; then
            echo "::error::Cannot resolve an ormi-core release from '$tag'."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      ORMI_RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' && github.sha ||
                needs.release.outputs.tag }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Resolve Windows JIT compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-Command cl.exe -ErrorAction Stop
          "ORMI_CPU_JIT_CXX=$($compiler.Source)" | Out-File $env:GITHUB_ENV -Append
          "ORMI_CPU_JIT_CXX_ID=msvc" | Out-File $env:GITHUB_ENV -Append

      - name: Resolve Linux JIT compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "ORMI_CPU_JIT_CXX=$(command -v g++)" >> "$GITHUB_ENV"
          echo "ORMI_CPU_JIT_CXX_ID=gcc" >> "$GITHUB_ENV"

      - name: Install published wheel
        run: python -m pip install numpy pytest

      - name: Install ORMI from its package index
        run: >-
          python -m pip install
          --no-deps
          --only-binary=:all:
          --index-url https://l-h-ha.github.io/Ormi/whl/
          ormi-core==${{ needs.release.outputs.version }}

      - name: Verify CPU without a compiler
        env:
          ORMI_CPU_JIT_CACHE_DIR: ${{ runner.temp }}/ormi-release-jit
          ORMI_CPU_JIT_CXX: ormi-compiler-does-not-exist
          ORMI_CPU_JIT_CXX_ID: >-
            ${{ runner.os == 'Windows' && 'msvc' || 'gcc' }}
        run: >-
          python -m pytest ormi-core/release-tests/test_cpu.py
          -q -p no:cacheprovider

      - name: Verify uncached CPU JIT
        env:
          ORMI_CPU_JIT_CACHE_DIR: ${{ runner.temp }}/ormi-release-jit
        run: >-
          python -m pytest ormi-core/release-tests/test_jit.py
          -q -p no:cacheprovider

      - name: Verify CPU package boundary
        run: >-
          python -m pytest
          ormi-core/release-tests/test_packages.py::test_core_install_is_cpu_only
          -q -p no:cacheprovider

      - name: Install matching CUDA backend
        run: >-
          python -m pip install
          --no-deps
          --only-binary=:all:
          --index-url https://l-h-ha.github.io/Ormi/whl/
          ormi-cuda==${{ needs.release.outputs.version }}

      - name: Verify CUDA package boundary
        run: >-
          python -m pytest
          ormi-core/release-tests/test_packages.py::test_cuda_install_matches_core
          -q -p no:cacheprovider
