name: C++ Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime.yml"
      - "ormi-core/CMakeLists.txt"
      - "ormi-core/CMakePresets.json"
      - "ormi-core/csrc/**"
  pull_request:
    paths:
      - ".github/workflows/runtime.yml"
      - "ormi-core/CMakeLists.txt"
      - "ormi-core/CMakePresets.json"
      - "ormi-core/csrc/**"
  workflow_dispatch:

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13
            package: g++-13
            cc: gcc-13
            cxx: g++-13
            jit_id: gcc
          - name: Clang 18
            package: clang-18
            cc: clang-18
            cxx: clang++-18
            jit_id: clang
    defaults:
      run:
        working-directory: ormi-core
    env:
      ORMI_CPU_JIT_CXX: ${{ matrix.cxx }}
      ORMI_CPU_JIT_CXX_ID: ${{ matrix.jit_id }}
      ORMI_CPU_JIT_CACHE_DIR: ${{ github.workspace }}/ormi-core/build-ci/jit-cache

    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build ${{ matrix.package }}

      - name: Report toolchain
        run: |
          cmake --version
          ninja --version
          ${{ matrix.cxx }} --version

      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DORMI_ENABLE_CUDA=OFF
          -DORMI_ENABLE_OPENBLAS=OFF
          -DORMI_BUILD_TESTS=ON
          -DORMI_BUILD_BENCHMARKS=OFF
          -DORMI_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Test
        run: |
          ulimit -c 0
          ctest --test-dir build-ci --output-on-failure --no-tests=error

  linux-sanitizers:
    name: Linux Clang sanitizers
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ormi-core
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ORMI_CPU_JIT_CXX: clang++-18
      ORMI_CPU_JIT_CXX_ID: clang
      ORMI_CPU_JIT_CACHE_DIR: ${{ github.workspace }}/ormi-core/build-sanitize/jit-cache

    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 ninja-build

      - name: Configure
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DORMI_ENABLE_SANITIZERS=ON
          -DORMI_ENABLE_CUDA=OFF
          -DORMI_ENABLE_OPENBLAS=OFF
          -DORMI_BUILD_TESTS=ON
          -DORMI_BUILD_BENCHMARKS=OFF
          -DORMI_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        run: |
          ulimit -c 0
          ctest --test-dir build-sanitize --output-on-failure --no-tests=error

  windows-msvc:
    name: Windows ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            cc: cl
            cxx: cl
            jit_id: msvc
          - name: clang-cl
            cc: clang-cl
            cxx: clang-cl
            jit_id: clang-cl
    defaults:
      run:
        working-directory: ormi-core
    env:
      ORMI_CPU_JIT_CXX_ID: ${{ matrix.jit_id }}
      ORMI_CPU_JIT_CACHE_DIR: ${{ github.workspace }}/ormi-core/build-ci/jit-cache
      VSCMD_SKIP_SENDTELEMETRY: 1

    steps:
      - uses: actions/checkout@v6

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add LLVM to PATH
        if: matrix.jit_id == 'clang-cl'
        shell: pwsh
        run: '"C:\Program Files\LLVM\bin" | Out-File $env:GITHUB_PATH -Append'

      - name: Report toolchain
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          $compiler = Get-Command ${{ matrix.cxx }} -ErrorAction Stop
          $compiler.Source
          if ('${{ matrix.jit_id }}' -eq 'clang-cl') {
            & $compiler.Source --version
          } else {
            Get-Item $compiler.Source | Select-Object -ExpandProperty VersionInfo |
              Select-Object ProductVersion, FileVersion
          }
          "ORMI_CPU_JIT_CXX=$($compiler.Source)" | Out-File $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DORMI_ENABLE_CUDA=OFF
          -DORMI_ENABLE_OPENBLAS=OFF
          -DORMI_BUILD_TESTS=ON
          -DORMI_BUILD_BENCHMARKS=OFF
          -DORMI_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure --no-tests=error

  windows-sanitizer:
    name: Windows MSVC AddressSanitizer
    runs-on: windows-2022
    defaults:
      run:
        working-directory: ormi-core
    env:
      ASAN_OPTIONS: halt_on_error=1
      ORMI_CPU_JIT_CXX_ID: msvc
      ORMI_CPU_JIT_CACHE_DIR: ${{ github.workspace }}/ormi-core/build-sanitize/jit-cache
      VSCMD_SKIP_SENDTELEMETRY: 1

    steps:
      - uses: actions/checkout@v6

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Report toolchain
        shell: pwsh
        run: |
          $compiler = Get-Command cl -ErrorAction Stop
          Get-Item $compiler.Source | Select-Object -ExpandProperty VersionInfo |
            Select-Object ProductVersion, FileVersion
          "ORMI_CPU_JIT_CXX=$($compiler.Source)" | Out-File $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DORMI_ENABLE_SANITIZERS=ON
          -DORMI_ENABLE_CUDA=OFF
          -DORMI_ENABLE_OPENBLAS=OFF
          -DORMI_BUILD_TESTS=ON
          -DORMI_BUILD_BENCHMARKS=OFF
          -DORMI_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure --no-tests=error

  windows-gcc:
    name: Windows GCC UCRT64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
        working-directory: ormi-core
    env:
      ORMI_CPU_JIT_CXX: g++.exe
      ORMI_CPU_JIT_CXX_ID: gcc
      ORMI_CPU_JIT_CACHE_DIR: ${{ github.workspace }}/ormi-core/build-ci/jit-cache

    steps:
      - uses: actions/checkout@v6

      - name: Setup UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja

      - name: Report toolchain
        run: |
          cmake --version
          ninja --version
          g++ --version

      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DORMI_ENABLE_CUDA=OFF
          -DORMI_ENABLE_OPENBLAS=OFF
          -DORMI_BUILD_TESTS=ON
          -DORMI_BUILD_BENCHMARKS=OFF
          -DORMI_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure --no-tests=error
