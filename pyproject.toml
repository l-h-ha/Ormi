[project]
name = "ormi-workspace"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "ormi-core",
]

[tool.uv.workspace]
members = ["ormi-core", "ormi-cuda"]

[tool.uv.sources]
ormi-core = { workspace = true }
ormi-cuda = { workspace = true }

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    "PyYAML>=6.0",
]
