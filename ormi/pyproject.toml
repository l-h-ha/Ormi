[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ormi"
version = "0.1.0a7"
description = "Python API for ORMI tensors and neural networks."
readme = "README.md"
authors = [{ name = "Ha H. Le" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = ["ormi-core==0.1.0a7", "tqdm>=4.67,<5"]

[project.optional-dependencies]
cuda = ["ormi-cuda==0.1.0a7"]
examples = []

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ormi*"]

[tool.setuptools.package-data]
ormi = ["py.typed"]
